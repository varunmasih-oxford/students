    <!-- Cell Merging -->

    <table border="10">
        <tr>
            <th colspan="5">student data table</th>

        </tr>
        <tr>
            <th>No</th>
            <th>Full Name</th>
            <th rowspan="3">Center</th>
            <th>Position</th>
            <th>Salary</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Stud 1</td>
            <td>Manager</td>
            <td>100000</td>
        </tr>
        
        <tr>
            <td>2</td>
            <td>Stud 2</td>
            <td>Sr. Manager</td>
            <td>1000000</td>
        </tr>
        
        <tr>
            <td>3</td>
            <td colspan="1">Stud 3</td>
            <td>Center 2</td>
            <td>CEO</td>
            <td rowspan="2">10000000</td>
        </tr>
        
        <tr>
            <td>4</td>
            <td>Stud 4</td>
            <td>Center 3</td>
            <td>COO</td>
        </tr>
        
    </table>
</body>
