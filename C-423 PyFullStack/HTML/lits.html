<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- order list -->
     <ol type="I" start="5"> <!-- I, i, A, a, 1, 2 -->
        <li>Student</li>
        <li>Student</li>
        <li>Student</li>
        <li>Student</li>
        <li>Student</li>
     </ol>
     <!-- unordered list -->
     <ul type="square"> <!-- circle square bullets -->
         <li>Student</li>
         <li>Student</li>
         <li>Student</li>
         <li>Student</li>
         <li>Student</li>
        </ul>
        <!-- Nested list -->
        <ol>
           <li>Student</li>
           <li>Student
            <ol type="a">
                <li>sub item</li>
                <li>sub item</li>
            </ol>
           </li>
        </ol>

        <!-- description list -->
         <dl>
            <dt>Term 1</dt>
            <dd>Definition 1</dd>

            <dt>HTML</dt>
            <dd>HyperText Markup Language</dd>
         </dl>
</body>
</html>
